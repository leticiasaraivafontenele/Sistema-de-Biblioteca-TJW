<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          crossorigin="anonymous">
    <link th:href="@{/css/cafeteria.css}" rel="stylesheet">
</head>
<body>

<!-- ============ NAVBAR ============ -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">☕ Biblioteca</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#menu" aria-controls="menu" aria-expanded="false">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/livros}">Livros</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/autores}">Autores</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ============ MENSAGENS (flash / erros) ============ -->
<div th:fragment="mensagens" class="mt-3">
    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${sucesso}">Sucesso</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>
    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${erro}">Erro</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>
    <div th:if="${errosApi}" class="alert alert-danger" role="alert">
        <strong>Não foi possível salvar:</strong>
        <ul class="mb-0">
            <li th:each="msg : ${errosApi}" th:text="${msg}">mensagem de erro</li>
        </ul>
    </div>
</div>

<!-- ============ FOOTER ============ -->
<footer th:fragment="footer" class="text-center text-muted py-4 mt-5 border-top">
    <small>IFCE — Ciência da Computação · Trabalho Final de Microsserviços com Spring Boot</small>
</footer>

<script th:fragment="scripts"
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>

</body>
</html>
