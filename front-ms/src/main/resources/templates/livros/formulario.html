<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head th:replace="~{fragments/layout :: head('Formulário de Livro - Biblioteca')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <div th:replace="~{fragments/layout :: mensagens}"></div>

    <h1 class="h3 mt-4 mb-3" th:text="${livro.id} != null ? 'Editar Livro' : 'Novo Livro'">Livro</h1>

    <form th:action="${livro.id} != null ? @{/livros/{id}(id=${livro.id})} : @{/livros}"
          th:object="${livro}" method="post" class="row g-3" novalidate>

        <input type="hidden" th:field="*{id}">

        <div class="col-md-8">
            <label for="titulo" class="form-label">Título</label>
            <input type="text" id="titulo" th:field="*{titulo}"
                   th:classappend="${#fields.hasErrors('titulo')} ? 'is-invalid'"
                   class="form-control" maxlength="150">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}">erro</div>
        </div>

        <div class="col-md-4">
            <label for="genero" class="form-label">Gênero</label>
            <input type="text" id="genero" th:field="*{genero}"
                   th:classappend="${#fields.hasErrors('genero')} ? 'is-invalid'"
                   class="form-control">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('genero')}" th:errors="*{genero}">erro</div>
        </div>

        <div class="col-md-4">
            <label for="anoPublicacao" class="form-label">Ano de Publicação</label>
            <input type="number" id="anoPublicacao" th:field="*{anoPublicacao}"
                   th:classappend="${#fields.hasErrors('anoPublicacao')} ? 'is-invalid'"
                   class="form-control">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('anoPublicacao')}" th:errors="*{anoPublicacao}">erro</div>
        </div>

        <div class="col-md-4">
            <label for="autorId" class="form-label">Autor</label>
            <select id="autorId" th:field="*{autorId}"
                    th:classappend="${#fields.hasErrors('autorId')} ? 'is-invalid'"
                    class="form-select">
                <option value="">Selecione um autor...</option>
                <option th:each="autor : ${autores}"
                        th:value="${autor.id}"
                        th:text="${autor.nome}">Autor</option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('autorId')}" th:errors="*{autorId}">erro</div>
        </div>

        <div class="col-md-4 d-flex align-items-end">
            <div class="form-check">
                <input type="checkbox" id="disponivel" th:field="*{disponivel}" class="form-check-input">
                <label for="disponivel" class="form-check-label">Disponível para empréstimo</label>
            </div>
        </div>

        <div class="col-12 mt-4">
            <button type="submit" class="btn btn-primary"
                    th:text="${livro.id} != null ? 'Atualizar' : 'Salvar'">Salvar</button>
            <a th:href="@{/livros}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
