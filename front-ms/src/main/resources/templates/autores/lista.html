<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head th:replace="~{fragments/layout :: head('Autores - Biblioteca')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <div th:replace="~{fragments/layout :: mensagens}"></div>

    <div class="d-flex justify-content-between align-items-center mt-4 mb-3">
        <h1 class="h3 mb-0">Autores</h1>
        <a th:href="@{/autores/novo}" class="btn btn-primary">+ Novo Autor</a>
    </div>

    <div th:if="${#lists.isEmpty(autores) and erro == null}" class="alert alert-info">
        Nenhum autor cadastrado ainda.
    </div>

    <div class="table-responsive" th:unless="${#lists.isEmpty(autores)}">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>Nome</th>
                <th>Nacionalidade</th>
                <th>Ano de Nascimento</th>
                <th class="text-end">Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="autor : ${autores}">
                <td th:text="${autor.nome}">Nome</td>
                <td th:text="${autor.nacionalidade}">Nacionalidade</td>
                <td th:text="${autor.anoNascimento}">2000</td>
                <td class="text-end">
                    <a th:href="@{/autores/{id}/editar(id=${autor.id})}"
                       class="btn btn-sm btn-outline-secondary">Editar</a>
                    <form th:action="@{/autores/{id}/excluir(id=${autor.id})}" method="post"
                          class="d-inline" th:data-nome="${autor.nome}"
                          onsubmit="return confirm('Deseja realmente excluir o autor ' + this.dataset.nome + '?');">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Excluir</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
